<style>

</style></head><body>
<div id="ban">يوجد إصدار جديد من التطبيق — <button class="b" onclick="upd()">حدّث الآن</button></div>
<header id="hb"><img id="ic"><h1>محاسب الشحن والشرائح</h1><span id="sy" style="font-size:18px"></span><button id="ins" style="display:none" onclick="inst()">⬇ تثبيت</button><button id="bA" class="br" onclick="sw('A')"></button><button id="bB" class="br" onclick="sw('B')"></button></header>

<div id="mod" onclick="if(event.target==this)this.style.display='none'"><div id="mb"></div></div>
<script>
const VER='1.8.0',$=i=>document.getElementById(i),N=x=>+x||0,F=x=>(Math.round(N(x)*100)/100).toLocaleString('en');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const CLEAR_PIN=false;/* ← لو نسيت الرقم السري: غيّرها true ثم افتح التطبيق مرة، وبعدها رجّعها false */
const SHEET_URL='https://script.google.com/macros/s/AKfycbwEppLQrNi_K8Qy2ODFS6CDjEjZOl2SGW7xjaL3QdFEf9C4nhNECzYc3XnvvnkMr3IYbg/exec';/* ← الصق رابط Apps Script (ينتهي بـ /exec) بين العلامتين */
const NM={A:'هواتف',B:'هواوي'},CAPS={A:35000,B:15000},RATE=5;
const td0=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const hp=s=>{let h=2166136261;for(const c of 'sk'+s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
let ul=0,olk=false,SY='',SM='';const unl=()=>Date.now()<ul,locked=d=>!!S.pin&&d<td0()&&!unl();
const TY={m:'ماكينة شحن',u:'يوزر شرائح',c:'بطاقات'};
const nb=()=>({days:{},open:{bal:{},cs:{d:0,c:0},par:{}},vch:[],ec:{}});
let S=JSON.parse(localStorage.getItem('shs')||'null')||{v:1,cur:'A',names:{A:'الفرع الأول',B:'الفرع الثاني'},rate:5,th:'light',url:'',ts:0,br:{A:nb(),B:nb()},defs:{cats:[],items:[],par:[]}};
if(!S.cap)S.cap={A:35000,B:15000};
if(!S.defs){S.defs={cats:[],items:[],par:[]};const a=S.br.A,cm={};(a.items||[]).forEach(i=>{if(!cm[i.t]){cm[i.t]=uid();S.defs.cats.push({id:cm[i.t],n:TY[i.t],t:i.t})}S.defs.items.push({id:i.id,n:i.n,cat:cm[i.t],s:i.t=='u'?[i.co||i.n]:[]})});(a.par||[]).forEach(p=>S.defs.par.push(p));(a.emps||[]).forEach(e=>S.defs.par.push({id:e.id,n:e.n,k:'e'}))}
let tab='day',date=td0(),flt='',mon=date.slice(0,7),dp;
const B=()=>S.br[S.cur];
function save(){S.ts=Date.now();localStorage.setItem('shs',JSON.stringify(S));clearTimeout(window.pt);window.pt=setTimeout(push,1500)}
function grid(){const cu=S.cur,out=[],ok=['charge','bal','sales','cnt0','cnt1'],E=v=>v===undefined||v===''?'':N(v),sum=a=>a.reduce((s,x)=>s+N(x),0);
['A','B'].forEach(k=>{S.cur=k;const I=D().items,U=I.filter(isU),sn=[];U.forEach(i=>subs(i).forEach(s=>{if(!sn.includes(s))sn.push(s)}));const rows=[],heads=[];
Object.keys(B().days).sort().filter(d=>I.some(i=>ok.some(x=>{const v=cell(i.id,d)[x];return v!==undefined&&v!==''}))).forEach(d=>{
const sm={};sn.forEach(s=>sm[s]=0);U.forEach(i=>subs(i).forEach((s,j)=>sm[s]+=cum(i.id,d,'cnt'+j)));const sv_=sn.map(s=>sm[s]);
const cs=I.map(i=>cell(i.id,d)),ks=I.map(i=>cost(i.id,d)),cn=I.map((i,x)=>isU(i)?subs(i).reduce((s,_,j)=>s+N(cs[x]['cnt'+j]),0):'');
heads.push(rows.length);
rows.push([d,'',...I.map(i=>i.n),'الإجمالي','',...sn,'الإجمالي']);
rows.push(['','شحن',...cs.map(c=>E(c.charge)),sum(cs.map(c=>c.charge)),'',...sv_,sum(sv_)]);
rows.push(['','الرصيد',...cs.map(c=>E(c.bal)),'']);
rows.push(['','التكلفة',...ks.map(x=>x===null?'':x),sum(ks)]);
rows.push(['','ت. المبيعات',...cs.map(c=>E(c.sales)),sum(cs.map(c=>c.sales))]);
rows.push(['','الشرائح',...cn,sum(cn)])});
const w=rows.reduce((m,r)=>Math.max(m,r.length),1);rows.forEach(r=>{while(r.length<w)r.push('')});out.push({name:NM[k],rows,heads})});
S.cur=cu;return out}
const U=()=>SHEET_URL||S.url;
function sy(i,m){SY=i;SM=m||'';const e=$('sy'),q=$('sm');if(e){e.textContent=i;e.title=SM}if(q)q.textContent=SY+' '+SM}
async function push(){if(!U())return;sy('⏳');const b=JSON.stringify({s:S,g:grid()});try{const x=(await(await fetch(U(),{method:'POST',body:b,headers:{'Content-Type':'text/plain;charset=utf-8'}})).text()).trim();sy(x=='ok'?'✓':'⚠',x=='ok'?'تم الرفع '+new Date().toLocaleTimeString('ar-EG'):x.slice(0,120))}catch(e){try{await fetch(U(),{method:'POST',mode:'no-cors',body:b});sy('☁','أُرسل بدون تأكيد')}catch(e2){sy('⚠','تعذر الاتصال')}}}
async function pull(f){if(!U())return f&&alert('أدخل رابط جوجل شيت أولاً');try{const d=await(await fetch(U())).json();if(d&&d.br&&(f||d.ts>S.ts)){const u=S.url;S=d;S.url=u;if(!S.defs)S.defs={cats:[],items:[],par:[]};if(!S.cap)S.cap={A:35000,B:15000};localStorage.setItem('shs',JSON.stringify(S));R()}}catch(e){if(f)alert('تعذر الاتصال')}}
setInterval(()=>{if(U()&&document.activeElement.tagName!='INPUT')pull(0)},20000);
function sw(k){S.cur=k;save();R()}
function go(t){tab=t;R()}
function R(){document.documentElement.dataset.th=S.th;
['A','B'].forEach(k=>{$('b'+k).textContent=NM[k];$('b'+k).classList.toggle('on',S.cur==k)});D().items.forEach(i=>{if(!i.t)i.t=((D().cats||[]).find(c=>c.id==i.cat)||{}).t||'m'});
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(tab=='items'||tab=='open'?'set':tab)));
$('m').innerHTML=({day:vDay,emp:vEmp,vch:vVch,rep:vRep,set:vSet,items:vItems,open:vOpen})[tab]()}
// ===== pin
function pin(cb){if(!S.pin)return cb();$('mb').innerHTML=`<h3>🔒 الرقم السري</h3><div class="row"><input id="pp" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري"></div><button class="b g" id="pk">تأكيد</button><button class="b" onclick="$('mod').style.display='none'">إلغاء</button><p id="pe" class="neg"></p>`;$('mod').style.display='flex';$('pk').onclick=()=>{if(hp($('pp').value.trim())==S.pin){$('mod').style.display='none';cb()}else $('pe').textContent='رقم سري غير صحيح'};setTimeout(()=>$('pp').focus(),60)}
function unlock(){pin(()=>{ul=Date.now()+300000;R()})}
const lockBar=L=>L?'<button class="b r" onclick="unlock()">🔒 يوم سابق — فتح بالرقم السري</button>':(S.pin&&date<td0()?'<span class="pos">🔓 مفتوح لمدة 5 دقائق</span>':'');
const hasOpen=()=>{const o=B().open,cs=o.cs||{d:o.cash||0,c:0};if(N(cs.d)||N(cs.c))return true;return[...Object.values(o.bal||{}),...Object.values(o.par||{})].some(x=>x&&typeof x=='object'?N(x.d)||N(x.c):N(x))};
function setPin(){const v=$('np1').value.trim();if(!/^\d{4,8}$/.test(v))return alert('الرقم السري من 4 إلى 8 أرقام');const f=()=>{S.pin=hp(v);save();R();alert('تم حفظ الرقم السري')};S.pin?pin(f):f()}
function rmPin(){pin(()=>{S.pin='';save();R()})}
function delV(id){pin(()=>{B().vch=B().vch.filter(x=>x.id!=id);save();R()})}
// ===== daily
const kind=i=>/ماكينة|ماكينه/.test(i.n)?'m':/يوزر/.test(i.n)?'u':'m',isU=i=>kind(i)=='u',auto=n=>/سوا/.test(n)?['سوا','جوي']:/فري[نت]د/.test(n)?['فريندي','فيرجن']:[n.replace(/^يوزر\s*/,'')],D=()=>S.defs,cat=id=>D().cats.find(c=>c.id==id)||{},ty=i=>kind(i),subs=i=>i.s&&i.s.length?i.s:auto(i.n);
const ob=(o,id)=>{const v=(o||{})[id];return v&&typeof v=='object'?N(v.d)-N(v.c):N(v)};
const PK={c:'عميل',s:'مورد',e:'موظف'},fb=n=>n>=0?F(n)+' مدين':F(-n)+' دائن';
function prev(id,d){const b=B(),ds=Object.keys(b.days).filter(x=>x<d&&b.days[x][id]&&b.days[x][id].bal!==undefined&&b.days[x][id].bal!=='').sort();return ds.length?N(b.days[ds.pop()][id].bal):ob(b.open.bal,id)}
const cell=(id,d)=>(B().days[d]||{})[id]||{};
const cost=(id,d)=>{const c=cell(id,d);return c.bal===undefined||c.bal===''?null:prev(id,d)+N(c.charge)-N(c.bal)};
const cum=(id,d,k)=>Object.keys(B().days).filter(x=>x.slice(0,7)==d.slice(0,7)&&x<=d).reduce((s,x)=>s+N(((B().days[x]||{})[id]||{})[k]),0);
function sv(id,k,v){if(locked(date)){R();return}const b=B();(b.days[date]=b.days[date]||{})[id]=b.days[date][id]||{};b.days[date][id][k]=v;save();rf()}
function rf(){let T=[0,0,0,0];D().items.forEach(i=>{const c=cell(i.id,date),k=cost(i.id,date),sb=subs(i);T[0]+=N(c.charge);T[1]+=k||0;T[2]+=N(c.sales);if(isU(i))sb.forEach((s,j)=>{T[3]+=N(c['cnt'+j]);const q=$('u_'+i.id+'_'+j);if(q)q.textContent=cum(i.id,date,'cnt'+j)});const e=$('k_'+i.id);if(e)e.textContent=k===null?'-':F(k)});[0,1,2].forEach(j=>{const e=$('t'+j);if(e)e.textContent=F(T[j])});const e3=$('t3');if(e3)e3.textContent=T[3];const p=$('tp');if(p){p.textContent=F(T[2]-T[1]);p.className=T[2]-T[1]>=0?'pos':'neg'}}
function vDay(){const L=locked(date);let T=[0,0,0,0];
let h=`<div class="card"><div class="row np"><input type="date" value="${date}" onchange="date=this.value;R()"><button class="b" onclick="expo()">تصدير PDF</button>${lockBar(L)}</div><div class="sc"><table class="fx"><tr><th>الصنف</th><th>الشحن</th><th>رصيد آخر اليوم</th><th>التكلفة</th><th>المبيعات</th><th>عدد الشرائح (إدخال)</th><th>الشرائح المجمعة (من أول الشهر)</th></tr>`;
D().items.forEach(i=>{const c=cell(i.id,date),k=cost(i.id,date),u=isU(i),sb=subs(i);T[0]+=N(c.charge);T[1]+=k||0;T[2]+=N(c.sales);sb.forEach((s,j)=>T[3]+=u?N(c['cnt'+j]):0);
const inp=(key,v)=>`<input type="number" inputmode="decimal" value="${v??''}" ${L?'readonly':''} oninput="sv('${i.id}','${key}',this.value)">`;
h+=`<tr><td>${i.n}</td><td>${inp('charge',c.charge)}</td><td>${inp('bal',c.bal)}</td><td id="k_${i.id}">${k===null?'-':F(k)}</td><td>${inp('sales',c.sales)}</td><td>${u?sb.map((s,j)=>`<span class="sm"><small>${s}</small>${inp('cnt'+j,c['cnt'+j])}</span>`).join(''):'-'}</td><td>${u?sb.map((s,j)=>`<span class="sm"><small>${s}</small><b id="u_${i.id}_${j}">${cum(i.id,date,'cnt'+j)}</b></span>`).join(''):'-'}</td></tr>`});
h+=`<tr class="tot"><td>الإجمالي</td><td id="t0">${F(T[0])}</td><td></td><td id="t1">${F(T[1])}</td><td id="t2">${F(T[2])}</td><td id="t3">${T[3]}</td><td>ربح: <span id="tp" class="${T[2]-T[1]>=0?'pos':'neg'}">${F(T[2]-T[1])}</span></td></tr></table></div>${D().items.length?'':'<p>أضف الأصناف من الإعدادات ← إعداد الأصناف</p>'}</div>`;return h}
// ===== items
function vItems(){return`<div class="card"><h3>الأصناف (مشتركة بين الفرعين)</h3><div class="row"><input id="in" placeholder="اسم الصنف: ماكينة سوا / يوزر سوا"><input id="is" placeholder="الشرائح (اختياري، بفاصلة)"><button class="b" onclick="addI()">إضافة</button></div><small>الاسم يحدد الخانات: «ماكينة...» بدون شرائح، و«يوزر...» تفتح خانات الشرائح. يوزر سوا ← (سوا، جوي)، ويوزر فريندي ← (فريندي، فيرجن).</small><table>${D().items.map(i=>`<tr><td>${i.n}</td><td>${isU(i)?subs(i).join(' + '):'بدون شرائح'}</td><td><button class="b" onclick="editI('${i.id}')">✎ تعديل</button><button class="b r" onclick="delI('${i.id}')">حذف</button></td></tr>`).join('')}</table></div>`}
function addI(){const n=$('in').value.trim();if(!n)return;const s=$('is').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);D().items.push({id:uid(),n,s});save();R()}
function editI(id){pin(()=>editI0(id))}
function editI0(id){const i=D().items.find(x=>x.id==id);$('mb').innerHTML=`<h3>تعديل الصنف</h3><div class="row"><input id="en1" value="${i.n.replace(/"/g,'&quot;')}"></div><div class="row"><input id="es" value="${(i.s||[]).join('، ')}" placeholder="الشرائح بفاصلة (اتركه فارغًا للتلقائي)"></div><button class="b g" onclick="saveI('${id}')">حفظ</button><button class="b" onclick="$('mod').style.display='none'">إلغاء</button>`;$('mod').style.display='flex'}
function saveI(id){const i=D().items.find(x=>x.id==id);i.n=$('en1').value.trim()||i.n;i.s=$('es').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);$('mod').style.display='none';save();R()}
function editP(id){pin(()=>editP0(id))}
function editP0(id){const p=D().par.find(x=>x.id==id),n=prompt('الاسم',p.n);if(n===null)return;p.n=n.trim()||p.n;save();R()}
function delP(id){pin(()=>delP0(id))}
function delP0(id){if(['A','B'].some(k=>S.br[k].vch.some(v=>v.p==id)||(S.br[k].open.par||{})[id]))return alert('عليه حركة أو رصيد أول مدة، لا يمكن حذفه');if(confirm('حذف؟')){D().par=D().par.filter(p=>p.id!=id);save();R()}}
function delI(i){pin(()=>delI0(i))}
function delI0(i){if(confirm('حذف الصنف؟')){D().items=D().items.filter(x=>x.id!=i);save();R()}}
// ===== opening
function so(k,id,f,v){if(olk){R();return}const o=B().open;if(k=='cs'){o.cs=o.cs||{d:0,c:0};o.cs[f]=N(v)}else{let x=o[k][id];if(!x||typeof x!='object')x={d:N(x),c:0};x[f]=N(v);o[k][id]=x}save();rfO()}
function rfO(){const b=B(),cs=b.open.cs||{d:b.open.cash||0,c:0};let td=N(cs.d),tc=N(cs.c);D().items.forEach(i=>{const[x,y]=oc('bal',i.id);td+=x;tc+=y});D().par.forEach(p=>{const[x,y]=oc('par',p.id);td+=x;tc+=y});$('otd').textContent=F(td);$('otc').textContent=F(tc);const f=$('odf');f.textContent=F(td-tc);f.className=td==tc?'pos':'neg'}
const ov=(k,id,f)=>{const x=B().open[k][id];return x&&typeof x=='object'?x[f]||'':(f=='d'&&x?x:'')};
function vOpen(){olk=!!S.pin&&!unl()&&hasOpen();const b=B(),cs=b.open.cs||{d:b.open.cash||0,c:0};let td=N(cs.d),tc=N(cs.c);
const r=(k,id,n)=>{td+=N(ov(k,id,'d'));tc+=N(ov(k,id,'c'));return`<tr><td>${n}</td><td><input type="number" value="${ov(k,id,'d')}" ${olk?'readonly':''} oninput="so('${k}','${id}','d',this.value)"></td><td><input type="number" value="${ov(k,id,'c')}" ${olk?'readonly':''} oninput="so('${k}','${id}','c',this.value)"></td></tr>`};
const it=D().items.map(i=>r('bal',i.id,i.n)).join(''),pr=D().par.map(p=>r('par',p.id,p.n+' ('+PK[p.k]+')')).join('');
return`<div class="card"><h3>قيد أول المدة — ${NM[S.cur]}</h3>${olk?'<button class="b r" onclick="unlock()">🔒 مقفل — فتح بالرقم السري</button>':''}<p>أدخل الأرصدة قبل تسجيل أي حركة:</p><table><tr><th>البيان</th><th>مدين</th><th>دائن</th></tr><tr><td>الصندوق</td><td><input type="number" value="${cs.d||''}" ${olk?'readonly':''} oninput="so('cs',0,'d',this.value)"></td><td><input type="number" value="${cs.c||''}" ${olk?'readonly':''} oninput="so('cs',0,'c',this.value)"></td></tr>${it}${pr}<tr class="tot"><td>الإجمالي</td><td id="otd">${F(td)}</td><td id="otc">${F(tc)}</td></tr><tr><td>الفرق</td><td colspan="2" id="odf" class="${td==tc?'pos':'neg'}">${F(td-tc)}</td></tr></table></div>`}

tx++;const cs=b.open.cs||{d:b.open.cash||0,c:0},O='قيد أول المدة';let od=N(cs.d)-N(cs.c);add('0','cash',O,cs.d,cs.c);

function ms(k){const cu=S.cur;S.cur=k;const b=B(),I=D().items,ds=Object.keys(b.days).filter(d=>d.slice(0,7)==mon),o={ch:0,co:0,sa:0,per:{},cc:{}};

const vs=b.vch.filter(v=>v.d.slice(0,7)==mon);o.v=t=>vs.filter(v=>v.t==t).reduce((s,v)=>s+N(v.a),0);

const aS=Object.keys(b.days).reduce((s,d)=>s+I.reduce((q,i)=>q+N(cell(i.id,d).sales),0),0),aC=Object.keys(b.days).reduce((s,d)=>s+I.reduce((q,i)=>q+N(cell(i.id,d).charge),0),0),aV=t=>b.vch.filter(v=>v.t==t).reduce((s,v)=>s+N(v.a),0),cs=b.open.cs||{d:b.open.cash||0,c:0};

const nms=[...new Set([...Object.keys(x.cc),...Object.keys(y.cc)])],sr=nms.map(n=>[n,N(x.cc[n]),N(y.cc[n]),N(x.cc[n])+N(y.cc[n])]),st=[0,0,0];sr.forEach(r=>r.slice(1).forEach((v,j)=>st[j]+=v));sr.push(['الإجمالي',...st]);
const sim={t:'شرائح شهر '+T,h:['الشركة',NM.A,NM.B,'الإجمالي'],w:[2.4,1.2,1.2,1.2],b:[sr.length-1],r:sr};
const I=D().items,rows=[],bo=[],G=[0,0,0,0,0];[['الماكينات',I.filter(i=>!isU(i))],['اليوزرات',I.filter(isU)]].forEach(([n,L])=>{rows.push([n,'','','','','']);bo.push(rows.length-1);const Q=[0,0,0,0,0];L.forEach(i=>{const p=x.per[i.id]||{c:0,s:0},q=y.per[i.id]||{c:0,s:0},c=p.c+q.c,s=p.s+q.s,a=[p.s-p.c,q.s-q.c,c,s,s-c];rows.push([i.n,...a.map(F)]);a.forEach((v,j)=>Q[j]+=v)});rows.push(['إجمالي '+n,...Q.map(F)]);bo.push(rows.length-1);Q.forEach((v,j)=>G[j]+=v)});rows.push(['الإجمالي العام',...G.map(F)]);bo.push(rows.length-1);
