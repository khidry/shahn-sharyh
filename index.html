<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0ea5e9"><title>محاسب الشحن والشرائح</title>
<style>
:root{--p:#0ea5e9;--pd:#0369a1;--bg:#f0f9ff;--c:#fff;--t:#0c4a6e;--b:#bae6fd;--g:#16a34a;--r:#dc2626}
[data-th=dark]{--bg:#0b1b2b;--c:#12293f;--t:#e0f2fe;--b:#1e4a6e;--pd:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;border-radius:8px}header h1{font-size:14px;margin:0;flex:1}
header button{background:#ffffff30;color:#fff;border:0;border-radius:8px;padding:6px 8px;font-size:12px}
main{padding:10px;max-width:1000px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--p);color:#fff;padding:6px 4px;position:sticky;top:0}
td{border-bottom:1px solid var(--b);padding:3px;text-align:center}.sc{overflow-x:auto;max-height:65vh}
input,select,textarea{border:1px solid var(--b);border-radius:8px;padding:6px;background:var(--c);color:var(--t);font:inherit;max-width:100%}
td input{width:66px;text-align:center}input,select,textarea{font-size:16px!important;touch-action:manipulation}.b{background:var(--p);color:#fff;border:0;border-radius:8px;padding:7px 12px;margin:2px}
.b.r{background:var(--r)}.b.g{background:var(--g)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:2px solid var(--p);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--t);padding:9px 2px;font-size:12px}nav button.on{background:var(--p);color:#fff}
.tot td{font-weight:700;background:var(--b)}.pos{color:var(--g)}.neg{color:var(--r)}h3{margin:4px 0 8px}
#ban{display:none;background:#fde68a;color:#78350f;padding:8px;text-align:center}
#mod{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:center;justify-content:center}#mod>div{background:var(--c);padding:16px;border-radius:12px;max-width:90%;max-height:80vh;overflow:auto}
#hb button.br{padding:6px 12px;font-size:13px}#hb button.on{background:#fff;color:var(--pd);font-weight:700}
.fx th{position:sticky;top:0;z-index:2}.fx th:first-child,.fx td:first-child{position:sticky;right:0;background:var(--c);z-index:1;min-width:84px}.fx th:first-child{z-index:3;background:var(--pd)}.fx tr.tot td:first-child{background:var(--b)}
.sm{display:inline-block;margin:0 2px}.sm small{display:block}.sm input{width:62px}.sc{max-height:72vh;-webkit-overflow-scrolling:touch}
@media print{header,nav,.np{display:none}}
</style></head><body>
<div id="ban">يوجد إصدار جديد من التطبيق — <button class="b" onclick="upd()">حدّث الآن</button></div>
<header id="hb"><img id="ic"><h1>محاسب الشحن والشرائح</h1><button id="ins" style="display:none" onclick="inst()">⬇ تثبيت</button><button id="bA" class="br" onclick="sw('A')"></button><button id="bB" class="br" onclick="sw('B')"></button></header>
<main id="m"></main>
<nav><button data-t="day" onclick="go('day')">📅 اليومي</button><button data-t="emp" onclick="go('emp')">👥 الموظفين</button><button data-t="vch" onclick="go('vch')">🧾 السندات</button><button data-t="rep" onclick="go('rep')">📊 التقارير</button><button data-t="set" onclick="go('set')">⚙ الإعدادات</button></nav>
<div id="mod" onclick="if(event.target==this)this.style.display='none'"><div id="mb"></div></div>
<script>
const VER='1.6.0',$=i=>document.getElementById(i),N=x=>+x||0,F=x=>(Math.round(N(x)*100)/100).toLocaleString('en');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const NM={A:'هواتف',B:'هواوي'},CAPS={A:35000,B:15000},RATE=5;
const TY={m:'ماكينة شحن',u:'يوزر شرائح',c:'بطاقات'};
const nb=()=>({days:{},open:{bal:{},cs:{d:0,c:0},par:{}},vch:[],ec:{}});
let S=JSON.parse(localStorage.getItem('shs')||'null')||{v:1,cur:'A',names:{A:'الفرع الأول',B:'الفرع الثاني'},rate:5,th:'light',url:'',ts:0,br:{A:nb(),B:nb()},defs:{cats:[],items:[],par:[]}};
if(!S.cap)S.cap={A:35000,B:15000};
if(!S.defs){S.defs={cats:[],items:[],par:[]};const a=S.br.A,cm={};(a.items||[]).forEach(i=>{if(!cm[i.t]){cm[i.t]=uid();S.defs.cats.push({id:cm[i.t],n:TY[i.t],t:i.t})}S.defs.items.push({id:i.id,n:i.n,cat:cm[i.t],s:i.t=='u'?[i.co||i.n]:[]})});(a.par||[]).forEach(p=>S.defs.par.push(p));(a.emps||[]).forEach(e=>S.defs.par.push({id:e.id,n:e.n,k:'e'}))}
let tab='day',date=new Date().toISOString().slice(0,10),flt='',mon=date.slice(0,7),dp;
const B=()=>S.br[S.cur];
function save(){S.ts=Date.now();localStorage.setItem('shs',JSON.stringify(S));clearTimeout(window.pt);window.pt=setTimeout(push,1500)}
function expo(){const o=[...$('m').querySelectorAll('input')],c=$('m').cloneNode(true);[...c.querySelectorAll('input')].forEach((x,i)=>x.replaceWith(document.createTextNode(o[i].value||'')));c.querySelectorAll('.np,button,select').forEach(x=>x.remove());
const h='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير</title><style>body{font-family:Tahoma,sans-serif;padding:12px}table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}th{background:#0ea5e9;color:#fff;padding:5px}td{border:1px solid #bae6fd;padding:4px;text-align:center}.tot td{background:#e0f2fe;font-weight:700}h3{color:#0369a1}.pos{color:#16a34a}.neg{color:#dc2626}</style></head><body><h2>'+NM[S.cur]+' — '+new Date().toISOString().slice(0,10)+'</h2>'+c.innerHTML+'</body></html>';
const f=new File([h],'report-'+S.cur+'-'+new Date().toISOString().slice(0,10)+'.html',{type:'text/html'});
if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}
function flat(){const cu=S.cur,rows=[['التاريخ','الفرع','الصنف','الشحن','رصيد آخر اليوم','التكلفة','المبيعات','شرائح 1','شرائح 2']];['A','B'].forEach(k=>{S.cur=k;Object.keys(B().days).sort().forEach(d=>D().items.forEach(i=>{const c=cell(i.id,d);if(['charge','bal','sales','cnt0','cnt1'].every(x=>c[x]===undefined||c[x]===''))return;const kk=cost(i.id,d);rows.push([d,NM[k],i.n,N(c.charge),c.bal===undefined||c.bal===''?'':N(c.bal),kk===null?'':kk,N(c.sales),N(c.cnt0),N(c.cnt1)])}))});S.cur=cu;return rows}
async function push(){if(!S.url)return;try{await fetch(S.url,{method:'POST',mode:'no-cors',body:JSON.stringify({s:S,f:flat()})})}catch(e){}}
async function pull(f){if(!S.url)return alert('أدخل رابط جوجل شيت أولاً');try{const d=await(await fetch(S.url)).json();if(d&&d.br&&(f||d.ts>S.ts)){const u=S.url;S=d;S.url=u;if(!S.defs)S.defs={cats:[],items:[],par:[]};if(!S.cap)S.cap={A:35000,B:15000};localStorage.setItem('shs',JSON.stringify(S));R()}}catch(e){if(f)alert('تعذر الاتصال')}}
setInterval(()=>{if(S.url&&document.activeElement.tagName!='INPUT')pull(0)},20000);
function sw(k){S.cur=k;save();R()}
function go(t){tab=t;R()}
function R(){document.documentElement.dataset.th=S.th;
['A','B'].forEach(k=>{$('b'+k).textContent=NM[k];$('b'+k).classList.toggle('on',S.cur==k)});D().items.forEach(i=>{if(!i.t)i.t=((D().cats||[]).find(c=>c.id==i.cat)||{}).t||'m'});
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(tab=='items'||tab=='open'?'set':tab)));
$('m').innerHTML=({day:vDay,emp:vEmp,vch:vVch,rep:vRep,set:vSet,items:vItems,open:vOpen})[tab]()}
// ===== daily
const kind=i=>/ماكينة|ماكينه/.test(i.n)?'m':/يوزر/.test(i.n)?'u':'m',isU=i=>kind(i)=='u',auto=n=>/سوا/.test(n)?['سوا','جوي']:/فري[نت]د/.test(n)?['فريندي','فيرجن']:[n.replace(/^يوزر\s*/,'')],D=()=>S.defs,cat=id=>D().cats.find(c=>c.id==id)||{},ty=i=>kind(i),subs=i=>i.s&&i.s.length?i.s:auto(i.n);
const ob=(o,id)=>{const v=(o||{})[id];return v&&typeof v=='object'?N(v.d)-N(v.c):N(v)};
const PK={c:'عميل',s:'مورد',e:'موظف'},fb=n=>n>=0?F(n)+' مدين':F(-n)+' دائن';
function prev(id,d){const b=B(),ds=Object.keys(b.days).filter(x=>x<d&&b.days[x][id]&&b.days[x][id].bal!==undefined&&b.days[x][id].bal!=='').sort();return ds.length?N(b.days[ds.pop()][id].bal):ob(b.open.bal,id)}
const cell=(id,d)=>(B().days[d]||{})[id]||{};
const cost=(id,d)=>{const c=cell(id,d);return c.bal===undefined||c.bal===''?null:prev(id,d)+N(c.charge)-N(c.bal)};
const cum=(id,d,k)=>Object.keys(B().days).filter(x=>x.slice(0,7)==d.slice(0,7)&&x<=d).reduce((s,x)=>s+N(((B().days[x]||{})[id]||{})[k]),0);
function sv(id,k,v){const b=B();(b.days[date]=b.days[date]||{})[id]=b.days[date][id]||{};b.days[date][id][k]=v;save();rf()}
function rf(){let T=[0,0,0,0];D().items.forEach(i=>{const c=cell(i.id,date),k=cost(i.id,date),sb=subs(i);T[0]+=N(c.charge);T[1]+=k||0;T[2]+=N(c.sales);if(isU(i))sb.forEach((s,j)=>{T[3]+=N(c['cnt'+j]);const q=$('u_'+i.id+'_'+j);if(q)q.textContent=cum(i.id,date,'cnt'+j)});const e=$('k_'+i.id);if(e)e.textContent=k===null?'-':F(k)});[0,1,2].forEach(j=>{const e=$('t'+j);if(e)e.textContent=F(T[j])});const e3=$('t3');if(e3)e3.textContent=T[3];const p=$('tp');if(p){p.textContent=F(T[2]-T[1]);p.className=T[2]-T[1]>=0?'pos':'neg'}}
function vDay(){let T=[0,0,0,0];
let h=`<div class="card"><div class="row np"><input type="date" value="${date}" onchange="date=this.value;R()"><button class="b" onclick="expo()">تصدير</button></div><div class="sc"><table class="fx"><tr><th>الصنف</th><th>الشحن</th><th>رصيد آخر اليوم</th><th>التكلفة</th><th>المبيعات</th><th>عدد الشرائح (إدخال)</th><th>الشرائح المجمعة (من أول الشهر)</th></tr>`;
D().items.forEach(i=>{const c=cell(i.id,date),k=cost(i.id,date),u=isU(i),sb=subs(i);T[0]+=N(c.charge);T[1]+=k||0;T[2]+=N(c.sales);sb.forEach((s,j)=>T[3]+=u?N(c['cnt'+j]):0);
const inp=(key,v)=>`<input type="number" inputmode="decimal" value="${v??''}" oninput="sv('${i.id}','${key}',this.value)">`;
h+=`<tr><td>${i.n}</td><td>${inp('charge',c.charge)}</td><td>${inp('bal',c.bal)}</td><td id="k_${i.id}">${k===null?'-':F(k)}</td><td>${inp('sales',c.sales)}</td><td>${u?sb.map((s,j)=>`<span class="sm"><small>${s}</small>${inp('cnt'+j,c['cnt'+j])}</span>`).join(''):'-'}</td><td>${u?sb.map((s,j)=>`<span class="sm"><small>${s}</small><b id="u_${i.id}_${j}">${cum(i.id,date,'cnt'+j)}</b></span>`).join(''):'-'}</td></tr>`});
h+=`<tr class="tot"><td>الإجمالي</td><td id="t0">${F(T[0])}</td><td></td><td id="t1">${F(T[1])}</td><td id="t2">${F(T[2])}</td><td id="t3">${T[3]}</td><td>ربح: <span id="tp" class="${T[2]-T[1]>=0?'pos':'neg'}">${F(T[2]-T[1])}</span></td></tr></table></div>${D().items.length?'':'<p>أضف الأصناف من الإعدادات ← إعداد الأصناف</p>'}</div>`;return h}
// ===== items
function vItems(){return`<div class="card"><h3>الأصناف (مشتركة بين الفرعين)</h3><div class="row"><input id="in" placeholder="اسم الصنف: ماكينة سوا / يوزر سوا"><input id="is" placeholder="الشرائح (اختياري، بفاصلة)"><button class="b" onclick="addI()">إضافة</button></div><small>الاسم يحدد الخانات: «ماكينة...» بدون شرائح، و«يوزر...» تفتح خانات الشرائح. يوزر سوا ← (سوا، جوي)، ويوزر فريندي ← (فريندي، فيرجن).</small><table>${D().items.map(i=>`<tr><td>${i.n}</td><td>${isU(i)?subs(i).join(' + '):'بدون شرائح'}</td><td><button class="b" onclick="editI('${i.id}')">✎ تعديل</button><button class="b r" onclick="delI('${i.id}')">حذف</button></td></tr>`).join('')}</table></div>`}
function addI(){const n=$('in').value.trim();if(!n)return;const s=$('is').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);D().items.push({id:uid(),n,s});save();R()}
function editI(id){const i=D().items.find(x=>x.id==id);$('mb').innerHTML=`<h3>تعديل الصنف</h3><div class="row"><input id="en1" value="${i.n.replace(/"/g,'&quot;')}"></div><div class="row"><input id="es" value="${(i.s||[]).join('، ')}" placeholder="الشرائح بفاصلة (اتركه فارغًا للتلقائي)"></div><button class="b g" onclick="saveI('${id}')">حفظ</button><button class="b" onclick="$('mod').style.display='none'">إلغاء</button>`;$('mod').style.display='flex'}
function saveI(id){const i=D().items.find(x=>x.id==id);i.n=$('en1').value.trim()||i.n;i.s=$('es').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);$('mod').style.display='none';save();R()}
function editP(id){const p=D().par.find(x=>x.id==id),n=prompt('الاسم',p.n);if(n===null)return;p.n=n.trim()||p.n;save();R()}
function delP(id){if(['A','B'].some(k=>S.br[k].vch.some(v=>v.p==id)||(S.br[k].open.par||{})[id]))return alert('عليه حركة أو رصيد أول مدة، لا يمكن حذفه');if(confirm('حذف؟')){D().par=D().par.filter(p=>p.id!=id);save();R()}}
function delI(i){if(confirm('حذف الصنف؟')){D().items=D().items.filter(x=>x.id!=i);save();R()}}
// ===== opening
function so(k,id,f,v){const o=B().open;if(k=='cs'){o.cs=o.cs||{d:0,c:0};o.cs[f]=N(v)}else{let x=o[k][id];if(!x||typeof x!='object')x={d:N(x),c:0};x[f]=N(v);o[k][id]=x}save();rfO()}
function rfO(){const b=B(),cs=b.open.cs||{d:b.open.cash||0,c:0};let td=N(cs.d),tc=N(cs.c);D().items.forEach(i=>{const[x,y]=oc('bal',i.id);td+=x;tc+=y});D().par.forEach(p=>{const[x,y]=oc('par',p.id);td+=x;tc+=y});$('otd').textContent=F(td);$('otc').textContent=F(tc);const f=$('odf');f.textContent=F(td-tc);f.className=td==tc?'pos':'neg'}
const ov=(k,id,f)=>{const x=B().open[k][id];return x&&typeof x=='object'?x[f]||'':(f=='d'&&x?x:'')};
function vOpen(){const b=B(),cs=b.open.cs||{d:b.open.cash||0,c:0};let td=N(cs.d),tc=N(cs.c);
const r=(k,id,n)=>{td+=N(ov(k,id,'d'));tc+=N(ov(k,id,'c'));return`<tr><td>${n}</td><td><input type="number" value="${ov(k,id,'d')}" oninput="so('${k}','${id}','d',this.value)"></td><td><input type="number" value="${ov(k,id,'c')}" oninput="so('${k}','${id}','c',this.value)"></td></tr>`};
const it=D().items.map(i=>r('bal',i.id,i.n)).join(''),pr=D().par.map(p=>r('par',p.id,p.n+' ('+PK[p.k]+')')).join('');
return`<div class="card"><h3>قيد أول المدة — ${NM[S.cur]}</h3><p>أدخل الأرصدة قبل تسجيل أي حركة:</p><table><tr><th>البيان</th><th>مدين</th><th>دائن</th></tr><tr><td>الصندوق</td><td><input type="number" value="${cs.d||''}" oninput="so('cs',0,'d',this.value)"></td><td><input type="number" value="${cs.c||''}" oninput="so('cs',0,'c',this.value)"></td></tr>${it}${pr}<tr class="tot"><td>الإجمالي</td><td id="otd">${F(td)}</td><td id="otc">${F(tc)}</td></tr><tr><td>الفرق</td><td colspan="2" id="odf" class="${td==tc?'pos':'neg'}">${F(td-tc)}</td></tr></table></div>`}
// ===== employees
const emps=()=>D().par.filter(p=>p.k=='e');
function sc(e,v){const b=B();(b.ec[date]=b.ec[date]||{})[e]=N(v);save();rfE()}
const ecum=(e,d)=>Object.keys(B().ec).filter(x=>x.slice(0,7)==d.slice(0,7)&&x<=d).reduce((s,x)=>s+N(B().ec[x][e]),0);
function rfE(){let t=0;emps().forEach(e=>{const c=ecum(e.id,date),a=$('ecc_'+e.id),v=$('ecv_'+e.id);t+=c;if(a)a.textContent=c;if(v)v.textContent=F(c*RATE)});$('ect').textContent=t;$('ecq').textContent=F(t*RATE)}
function payE(id){const e=D().par.find(x=>x.id==id),c=ecum(id,date)*RATE,a=prompt('مبلغ العمولة المصروفة لـ '+e.n,c);if(a===null||!N(a))return;B().vch.push({id:uid(),d:date,t:'sal',p:id,a:N(a),n:'عمولة '+e.n+' شهر '+date.slice(0,7),no:B().vch.length+1});save();alert('تم تسجيل سند صرف العمولة')}
function vEmp(){const b=B();let t=0;return`<div class="card"><h3>شرائح الموظفين (عمولة ${RATE} ريال/شريحة)</h3><div class="row"><input type="date" value="${date}" onchange="date=this.value;R()"><input id="en" placeholder="موظف جديد (يُضاف للعملاء تلقائيًا)"><button class="b" onclick="if($('en').value){D().par.push({id:uid(),n:$('en').value,k:'e'});save();R()}">إضافة</button></div><div class="sc"><table><tr><th>الموظف</th><th>شرائح اليوم</th><th>إجمالي الشهر</th><th>العمولة</th><th>صرف</th></tr>${emps().map(e=>{const c=ecum(e.id,date);t+=c;return`<tr><td>${e.n} <button class="b" onclick="editP('${e.id}')">✎</button></td><td><input type="number" inputmode="decimal" value="${(b.ec[date]||{})[e.id]??''}" oninput="sc('${e.id}',this.value)"></td><td id="ecc_${e.id}">${c}</td><td id="ecv_${e.id}">${F(c*RATE)}</td><td><button class="b g" onclick="payE('${e.id}')">صرف العمولة</button></td></tr>`}).join('')}<tr class="tot"><td>الإجمالي</td><td></td><td id="ect">${t}</td><td id="ecq">${F(t*RATE)}</td><td></td></tr></table></div></div>`}
// ===== vouchers & parties
const VT={in:'سند قبض',out:'سند صرف',cs:'بيع آجل',cp:'شراء آجل',ex:'مصروف',sal:'راتب / عمولة'};
